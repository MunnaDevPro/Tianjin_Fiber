<!-- Product Modal (Alpine.js powered) -->
<div x-show="selectedProduct" 
     style="display: none;"
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6"
     @keydown.escape.window="selectedProduct = null"
     x-cloak>
    
    <!-- Backdrop -->
    <div x-show="selectedProduct" 
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="absolute inset-0 bg-brand-blue/80 backdrop-blur-sm"
         @click="selectedProduct = null"></div>

    <!-- Modal Panel -->
    <div x-show="selectedProduct" 
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         class="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col md:flex-row z-10">
        
        <!-- Close Button -->
        <button @click="selectedProduct = null" class="absolute top-4 right-4 z-20 w-10 h-10 bg-white/50 backdrop-blur rounded-full flex items-center justify-center text-slate-600 hover:text-brand-magenta hover:bg-white transition-all shadow-sm">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <!-- Image Gallery (Left Side) -->
        <div class="w-full md:w-1/2 bg-slate-100 h-64 md:h-auto relative" x-data="{ activeImageIndex: 0 }">
            <template x-if="selectedProduct">
                <div class="h-full w-full">
                    <img :src="selectedProduct.image" :alt="selectedProduct.name" class="w-full h-full object-cover" x-show="activeImageIndex === 0" loading="lazy">
                    <template x-for="(thumb, index) in selectedProduct.thumbnails">
                        <img :src="thumb" :alt="selectedProduct.name" class="w-full h-full object-cover" x-show="activeImageIndex === index + 1" loading="lazy">
                    </template>
                </div>
            </template>
            <!-- Thumbnails strip -->
            <div class="absolute bottom-4 left-0 w-full flex justify-center gap-2 px-4">
                <template x-if="selectedProduct">
                    <div class="flex gap-2 p-2 bg-white/80 backdrop-blur rounded-full">
                        <button @click="activeImageIndex = 0" class="w-12 h-12 rounded-full overflow-hidden border-2 transition-colors" :class="activeImageIndex === 0 ? 'border-brand-magenta' : 'border-transparent'">
                            <img :src="selectedProduct.image" class="w-full h-full object-cover" loading="lazy">
                        </button>
                        <template x-for="(thumb, index) in selectedProduct.thumbnails">
                            <button @click="activeImageIndex = index + 1" class="w-12 h-12 rounded-full overflow-hidden border-2 transition-colors" :class="activeImageIndex === index + 1 ? 'border-brand-magenta' : 'border-transparent'">
                                <img :src="thumb" class="w-full h-full object-cover" loading="lazy">
                            </button>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- Content (Right Side) -->
        <div class="w-full md:w-1/2 p-8 md:p-10 overflow-y-auto">
            <template x-if="selectedProduct">
                <div>
                    <h3 class="text-3xl font-display font-bold text-brand-blue mb-4" x-text="selectedProduct.name"></h3>
                    <p class="text-slate-600 mb-8 leading-relaxed" x-text="selectedProduct.description"></p>
                    
                    <h4 class="font-display font-semibold text-lg text-brand-blue mb-4 border-b pb-2">Key Features</h4>
                    <ul class="space-y-3 mb-8">
                        <template x-for="feature in selectedProduct.features">
                            <li class="flex items-start gap-3 text-slate-700">
                                <div class="mt-1 shrink-0 w-5 h-5 rounded-full bg-brand-cream flex items-center justify-center text-brand-magenta">
                                    <i data-lucide="check" class="w-3 h-3"></i>
                                </div>
                                <span x-text="feature"></span>
                            </li>
                        </template>
                    </ul>

                    <div class="pt-6 border-t flex flex-col sm:flex-row gap-4">
                        <a href="{% url 'core:contact' %}" class="btn-primary w-full sm:w-auto">Request Quote</a>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
