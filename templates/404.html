<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Tianbao</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between items-center p-4 md:p-8 relative overflow-hidden">
    <!-- Abstract Background Wave Shapes (Mockup Style) -->
    <div class="absolute -top-20 -left-20 w-72 h-72 bg-blue-600 rounded-full blur-[100px] opacity-15 pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-blue-800 rounded-full blur-[120px] opacity-15 pointer-events-none"></div>
    <div class="absolute top-1/2 left-0 w-48 h-[600px] bg-blue-500 rounded-full blur-[100px] opacity-10 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    
    <!-- Empty top spacer to balance layout -->
    <div></div>

    <!-- Center Content: 404 Illustration & Text -->
    <div class="w-full max-w-2xl flex flex-col items-center justify-center text-center relative z-10 px-4">
        <!-- Crop-optimized Illustration -->
        <img src="/static/core/images/error_404.png" alt="404 Error Illustration" class="w-full max-w-[340px] md:max-w-[420px] h-auto object-contain mb-6 md:mb-8 select-none pointer-events-none">
        
        <!-- Error Heading -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight mb-6">
            Page Not Found..!!
        </h1>
        
        <!-- CTA Button -->
        <a href="/" class="inline-flex items-center justify-center px-6 py-2.5 text-sm font-semibold tracking-wide text-white bg-blue-500 hover:bg-blue-600 rounded-lg transition-all duration-200 active:scale-[0.97]">
            Back Home
        </a>
    </div>

    <!-- Footer / Branding watermark -->
    <div class="text-center text-xs text-slate-400 mt-8 relative z-10">
        &copy; 2026 Tianjin Fiber Net. All rights reserved.
    </div>
</body>
</html>
